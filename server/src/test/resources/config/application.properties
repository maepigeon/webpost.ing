# ══════════════════════════════════════════════════════════════════════════════
#  Test overrides
#
#  Spring Boot reads classpath:/config/application.properties on top of
#  classpath:/application.properties, so this file layers over the main
#  configuration instead of hiding it (a src/test/resources/application.properties
#  would replace it outright). Only what differs in tests belongs here.
#
#  Tests get their own database, never the one DB_NAME points at: the
#  migration runner applies every pending version at startup, and the tests
#  write rows. TestDatabaseGuard refuses to start a test context whose database
#  name does not end in _test. Create it once with:
#
#      createdb webposting_test
#
#  See guide/MIGRATIONS.md.
# ══════════════════════════════════════════════════════════════════════════════

# Development behaviour, even from a shell that sourced deploy.env with
# APP_PROFILE=prod.
spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:webposting_test}
spring.datasource.username=${TEST_DB_USER:mae}
spring.datasource.password=${TEST_DB_PASSWORD:password}
