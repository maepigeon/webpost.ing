# ── Prod profile ──────────────────────────────────────────────────────────────
# Activated by APP_PROFILE=prod (or -Dspring.profiles.active=prod).
# Cookies require HTTPS. Uploads use an absolute path so they do not depend on
# the process working directory.
#
# No secrets here — see application.properties and guide/CONFIGURATION.md.

app.dev-mode=false

# No default: the server's deploy.env says where uploads live, and
# ProductionConfigCheck refuses to start without an absolute path.
app.upload-dir=${UPLOAD_DIR:}

# Production must not echo SQL or expose stack traces to clients.
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=${LOG_LEVEL:INFO}
