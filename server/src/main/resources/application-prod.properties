# ── Prod profile ──────────────────────────────────────────────────────────────
# Activated by APP_PROFILE=prod (or -Dspring.profiles.active=prod).
# Cookies require HTTPS. Uploads use an absolute path so they do not depend on
# the process working directory.
#
# No secrets here — see application.properties and guide/CONFIGURATION.md.

app.dev-mode=false

app.upload-dir=${UPLOAD_DIR:/var/www/webposting/uploads}

# Production must not echo SQL or expose stack traces to clients.
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=${LOG_LEVEL:INFO}
