# ══════════════════════════════════════════════════════════════════════════════
#  webpost.ing — base configuration
#
#  This file contains NO SECRETS and is committed to source control. Every
#  environment-specific value is read from an environment variable with a
#  local-development default, using ${VAR:default} syntax.
#
#  To configure a deployment, set environment variables — do not edit this file.
#  Copy config/deploy.env.example to deploy.env, fill it in, and source it
#  before starting the server. See guide/CONFIGURATION.md for every variable.
# ══════════════════════════════════════════════════════════════════════════════

spring.application.name=webpostingserver

# ── Environment toggle ────────────────────────────────────────────────────────
#   dev  — local development (HTTP cookies, relative upload folder)
#   prod — production (HTTPS-only cookies, absolute upload path)
spring.profiles.active=${APP_PROFILE:dev}

# ── Database ──────────────────────────────────────────────────────────────────
# No credentials here, not even placeholders. Locally the defaults are your
# own login name and no password, which a local PostgreSQL accepts for your
# own user. On a server, set DB_SOCKET for a passwordless connection (see
# DatabaseSocketConfig and guide/CONFIGURATION.md), or DB_USER/DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:testdb}
spring.datasource.username=${DB_USER:${USER:}}
spring.datasource.password=${DB_PASSWORD:}
# Directory of PostgreSQL's Unix socket, e.g. /var/run/postgresql. When set,
# the app connects through it with peer authentication: no password exists.
app.db.socket=${DB_SOCKET:}
app.db.name=${DB_NAME:testdb}
app.db.port=${DB_PORT:5432}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by the migration runner (see guide/MIGRATIONS.md), never by
# Hibernate. Do not change this.
spring.jpa.hibernate.ddl-auto=none

# ── Connection pool ───────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}

# ── Web server limits and compression ─────────────────────────────────────────
# The server has 2 GB. A save can hold a few MB of body per request, so cap the
# worker threads (Spring's default is 200) and queue the rest briefly.
server.tomcat.threads.max=${TOMCAT_THREADS:40}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}
# Compress JSON and text here, in case nginx does not gzip proxied responses.
# Only text types: audio and images must stay as they are for range requests.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# ── Behind a proxy ────────────────────────────────────────────────────────────
# Take the client's address from X-Forwarded-For, but only when the request
# comes from a proxy on this machine or a private network (nginx in
# production). Rate limits key on that address; without this, every request
# looks like it comes from nginx, and one person's failed logins lock out
# everyone.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}

# ── Upload limits ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:50MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:50MB}
app.upload-max-size=${UPLOAD_MAX_BYTES:52428800}

# ── Origins allowed to call the API with credentials ──────────────────────────
# Comma-separated. Must include every origin the frontend is served from.
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ── Sessions ──────────────────────────────────────────────────────────────────
# Absolute lifetime and idle timeout of a login session, in minutes.
app.session-lifetime-minutes=${SESSION_LIFETIME_MINUTES:1440}
app.session-idle-minutes=${SESSION_IDLE_MINUTES:720}

# ── Card previews ─────────────────────────────────────────────────────────────
# The background sweep that fills posts.card_preview and posts.search_text for
# posts saved before V020 (a few rows every two seconds, then one probe a
# minute). On by default; "Run now" in the admin panel works either way.
app.preview-sweep.enabled=${PREVIEW_SWEEP_ENABLED:true}

# ── Email (optional) ──────────────────────────────────────────────────────────
# Off by default. With MAIL_ENABLED=false nothing is sent, no SMTP connection is
# attempted, and every email feature degrades quietly: addresses can still be
# saved and preferences changed, they just cannot be verified.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@webpost.ing}

# Public base URL, used to build links that must work when opened from an inbox.
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Standard Spring mail settings; only read when MAIL_ENABLED is true.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
