# ══════════════════════════════════════════════════════════════════════════════
#  webpost.ing — base configuration
#
#  This file contains NO SECRETS and is committed to source control. Every
#  environment-specific value is read from an environment variable with a
#  local-development default, using ${VAR:default} syntax.
#
#  To configure a deployment, set environment variables — do not edit this file.
#  Copy config/deploy.env.example to deploy.env, fill it in, and source it
#  before starting the server. See guide/CONFIGURATION.md for every variable.
# ══════════════════════════════════════════════════════════════════════════════

spring.application.name=webpostingserver

# ── Environment toggle ────────────────────────────────────────────────────────
#   dev  — local development (HTTP cookies, relative upload folder)
#   prod — production (HTTPS-only cookies, absolute upload path)
spring.profiles.active=${APP_PROFILE:dev}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:testdb}
spring.datasource.username=${DB_USER:mae}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by the migration runner (see guide/MIGRATIONS.md), never by
# Hibernate. Do not change this.
spring.jpa.hibernate.ddl-auto=none

# ── Connection pool ───────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}

# ── Upload limits ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:50MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:50MB}
app.upload-max-size=${UPLOAD_MAX_BYTES:52428800}

# ── Origins allowed to call the API with credentials ──────────────────────────
# Comma-separated. Must include every origin the frontend is served from.
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ── Sessions ──────────────────────────────────────────────────────────────────
# Absolute lifetime and idle timeout of a login session, in minutes.
app.session-lifetime-minutes=${SESSION_LIFETIME_MINUTES:1440}
app.session-idle-minutes=${SESSION_IDLE_MINUTES:720}

# ── Email (optional) ──────────────────────────────────────────────────────────
# Off by default. With MAIL_ENABLED=false nothing is sent, no SMTP connection is
# attempted, and every email feature degrades quietly: addresses can still be
# saved and preferences changed, they just cannot be verified.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@webpost.ing}

# Public base URL, used to build links that must work when opened from an inbox.
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Standard Spring mail settings; only read when MAIL_ENABLED is true.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
