# ── Dev profile ───────────────────────────────────────────────────────────────
# Cookies work over plain HTTP (no 'secure' flag).
# No secrets here — see application.properties and guide/CONFIGURATION.md.

app.dev-mode=true

# Uploads stored relative to the server working directory (server/uploads/).
app.upload-dir=${UPLOAD_DIR:uploads}

logging.level.root=${LOG_LEVEL:INFO}
